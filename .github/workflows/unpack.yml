name: Import reviewed BM6 source

on:
  push:
    branches:
      - feat/bm6-ha-reviewed-integration
    paths:
      - ".import/bm6_ha_source.tar.xz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v7
        with:
          ref: feat/bm6-ha-reviewed-integration
      - name: Verify source archive
        shell: bash
        run: |
          echo "bf8dde6c8200ef3237ecb112891b1643a28c6cc8f7cd7b55eeae6220a723e656  .import/bm6_ha_source.tar.xz" | sha256sum --check -
      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .import/bm6_ha_source.tar.xz
          test -f custom_components/bm6_ha/manifest.json
          test -f .github/workflows/validate.yml
          test -f .github/workflows/test.yml
          python -m compileall -q custom_components/bm6_ha tests
      - name: Commit extracted files and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .import
          git rm .github/workflows/unpack.yml
          git add -A
          git commit -m "feat: import reviewed BM6 integration and CI"
          git push origin HEAD:feat/bm6-ha-reviewed-integration
