name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Home Assistant's pytest fixture treats sys.path entries as filesystem paths.
      # PEP 660 editable installs add a synthetic __editable__.*.__path_hook__
      # entry which fails that assumption during fixture setup.
      - name: Install test dependencies
        run: python -m pip install '.[dev]'
      - name: Test integration
        run: python -m pytest -q
      - name: Ruff critical lint
        run: python -m ruff check . --select E4,E7,E9,F
