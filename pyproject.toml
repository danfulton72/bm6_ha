[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bm6-ha"
version = "1.0.0"
description = "Home Assistant Bluetooth integration for the BM6 Battery Monitor"
requires-python = ">=3.14.2"
dependencies = ["homeassistant>=2026.11.1,<2026.12"]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-homeassistant[bluetooth]==2026.11.2",
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["custom_components.bm6_ha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
